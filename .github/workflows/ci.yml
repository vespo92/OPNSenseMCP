name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Build project
      run: bun run build

    - name: Check for TypeScript errors
      run: bunx tsc --noEmit

    - name: Run linter
      run: bun run lint || echo "Linting not configured"

    - name: Run tests
      run: bun run test

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-artifacts
        path: dist/

  # Bun is the toolchain, but the published package is consumed as
  # `node dist/index.js` (see the "bin" field). This proves the build Bun
  # produced actually boots under the Node versions users run it on.
  node-compat:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}

    - name: Download build artifacts
      uses: actions/download-artifact@v6
      with:
        name: build-artifacts
        path: dist/

    - name: Smoke test the built server under Node
      run: node dist/index.js < /dev/null 2>&1 | grep -q "running on stdio"
