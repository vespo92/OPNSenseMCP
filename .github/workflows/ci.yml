name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Build project
      run: bun run build

    - name: Check for TypeScript errors
      run: bunx tsc --noEmit

    - name: Run linter
      run: bun run lint || echo "Linting not configured"

    - name: Run tests
      run: bun run test

    # Pack the real publishable tarball so node-compat can install exactly what
    # users would get from npm, rather than a bare dist/ with no dependencies.
    - name: Pack the package
      run: npm pack

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-artifacts
        path: |
          dist/
          *.tgz

  # Bun is the toolchain, but the package is published to npm and consumed
  # under Node. This installs the actual packed tarball and boots its "bin"
  # entrypoint, so the toolchain switch cannot ship something only Bun can run.
  node-compat:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Download build artifacts
      uses: actions/download-artifact@v6
      with:
        name: build-artifacts

    - name: Install the packed package
      run: npm install --no-save ./opnsense-mcp-server-*.tgz

    - name: Smoke test the published entrypoint under Node
      run: node node_modules/.bin/opnsense-mcp-server < /dev/null 2>&1 | grep -q "running on stdio"
